spring:
  jpa:
    open-in-view: false
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: YmFyZHpvVGFqbnlJRGx1Z2lLbHVjelNla3JldG55RG9KV1QxMjM0NTY3ODkw
  expiration: 86400000

storage:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:wardrobe}
  public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000/wardrobe}

replicate:
  api-token: ${REPLICATE_API_TOKEN}
  model-version: ${REPLICATE_MODEL_VERSION}
  base-url: https://api.replicate.com/v1
  timeout: 30s

server:
  error:
    include-message: always